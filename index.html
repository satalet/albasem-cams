<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الباسم سات | غرفة المراقبة ورادار الكاميرات الحية</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  
  <!-- منع الكاش نهائياً من الهيدر -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .ratio-16-9 { aspect-ratio: 16 / 9; }
    .active-btn { background-color: #059669 !important; border-color: #10b981 !important; color: white !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-[#070a12] text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">

  <!-- Header -->
  <header class="bg-[#0d1322]/95 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap justify-between items-center gap-3">
      
      <!-- Brand & Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-white font-black text-xl">
          <i class="fa-solid fa-satellite-dish"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-black tracking-wide text-white">الباسم سات</h1>
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/30 animate-pulse">
              ● بث حي
            </span>
          </div>
          <p class="text-[11px] text-slate-400">رادار كاميرات الطرق والطقس المباشرة</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center bg-[#141c30] p-1 rounded-lg border border-slate-800 text-xs">
          <button id="btn-grid-1" onclick="changeLayout(1)" class="px-2.5 py-1 rounded transition text-slate-400 hover:text-white" title="شاشة واحدة">
            <i class="fa-solid fa-square"></i>
          </button>
          <button id="btn-grid-2" onclick="changeLayout(2)" class="px-2.5 py-1 rounded transition active-btn text-white" title="شاشتان">
            <i class="fa-solid fa-table-cells-large"></i>
          </button>
          <button id="btn-grid-3" onclick="changeLayout(3)" class="px-2.5 py-1 rounded transition text-slate-400 hover:text-white" title="شبكة ثلاثية">
            <i class="fa-solid fa-table-cells"></i>
          </button>
        </div>

        <!-- زر القفل الإداري -->
        <button id="auth-btn" onclick="handleAuthButtonClick()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5" title="دخول إدارة الباسم سات">
          <i class="fa-solid fa-lock text-emerald-400"></i>
          <span id="auth-btn-text" class="hidden md:inline">الإدارة</span>
        </button>

        <a href="tel:0534829927" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-phone text-emerald-400"></i>
          <span class="hidden md:inline">0534829927</span>
        </a>

        <a href="https://wa.me/972534829927?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%20%D8%A7%D9%84%D8%A8%D8%A7%D8%B3%D9%85%20%D8%B3%D8%A7%D8%AA%D8%8C%20%5B%D8%A8%D8%AB%20%D9%82%D9%86%D9%88%D8%A7%D8%AA%5D%20%D8%B9%D9%86%D8%AF%D9%8A%20%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%3A%20" target="_blank" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 shadow-lg shadow-emerald-600/20 transition transform active:scale-95">
          <i class="fa-brands fa-whatsapp text-sm"></i>
          <span>واتساب</span>
        </a>
      </div>

    </div>
  </header>

  <!-- شريط الإدارة الخاص بأبو باسم -->
  <div id="admin-bar" class="hidden bg-emerald-950/40 border-b border-emerald-500/30 px-4 py-2">
    <div class="max-w-7xl mx-auto flex justify-between items-center text-xs">
      <div class="flex items-center gap-2 text-emerald-300 font-bold">
        <i class="fa-solid fa-user-shield"></i>
        <span>وضع إدارة الباسم سات مفعّل</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-lg font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-plus"></i>
          <span>إضافة بث جديد</span>
        </button>
        <button onclick="handleAdminLogout()" class="bg-red-950/60 hover:bg-red-900 border border-red-800 text-red-300 px-2.5 py-1 rounded-lg transition font-bold">
          خروج
        </button>
      </div>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="bg-[#0b101d] border-b border-slate-800/60 px-4 py-2 sticky top-[57px] z-30">
    <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto text-xs py-1" id="filter-buttons">
      <button onclick="filterByArea('all')" class="filter-chip active-btn px-3 py-1 rounded-full border border-slate-700 font-medium whitespace-nowrap transition">
        جميع الكاميرات
      </button>
    </div>
  </div>

  <!-- Streams Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4">
    <div id="cams-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full py-12 text-center text-slate-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-500 mb-2"></i>
        <p>جاري تحميل الكاميرات المباشرة...</p>
      </div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-[#0f172a] border border-slate-700 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2 text-emerald-400 font-bold text-sm">
          <i class="fa-solid fa-shield-halved"></i>
          <span>دخول إدارة الباسم سات</span>
        </div>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleAdminLogin(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">البريد الإلكتروني</label>
          <input type="email" id="login-email" required class="w-full bg-[#0a0e17] border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 font-mono">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">كلمة المرور</label>
          <input type="password" id="login-password" required class="w-full bg-[#0a0e17] border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 font-mono">
        </div>
        <button type="submit" id="login-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg transition">
          تسجيل الدخول
        </button>
      </form>
    </div>
  </div>

  <!-- Edit/Add Modal -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-[#0f172a] border border-slate-700 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="edit-modal-title" class="text-sm font-bold text-emerald-400">➕ إضافة كاميرا جديدة</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="edit-form" onsubmit="handleSaveStream(event)" class="space-y-3 text-xs">
        <input type="hidden" id="edit-stream-id">
        <div>
          <label class="block text-slate-400 mb-1">اسم / عنوان الكاميرا</label>
          <input type="text" id="edit-title" required placeholder="مثلاً: جولة نابلسية" class="w-full bg-[#0a0e17] border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">المنطقة</label>
            <input type="text" id="edit-area" required placeholder="نابلس، كفر عقب..." class="w-full bg-[#0a0e17] border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">نوع البث</label>
            <select id="edit-type" class="w-full bg-[#0a0e17] border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500">
              <option value="hls">بث مباشر M3U8 (HLS)</option>
              <option value="youtube">بث يوتيوب (YouTube)</option>
              <option value="image">لقطة متجددة (Image)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">رابط البث المباشر (URL)</label>
          <input type="url" id="edit-url" required placeholder="https://..." class="w-full bg-[#0a0e17] border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 font-mono">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" id="edit-save-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg transition">
            حفظ ونشر فوراً
          </button>
          <button type="button" onclick="closeEditModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg transition">
            إلغاء
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fullscreen Modal -->
  <div id="cam-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-2 sm:p-6">
    <div class="bg-[#0f172a] border border-slate-700 w-full max-w-5xl rounded-2xl overflow-hidden shadow-2xl flex flex-col">
      <div class="px-4 py-3 bg-slate-900 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
          <h3 id="modal-title" class="text-sm sm:text-base font-bold text-white"></h3>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-content" class="bg-black ratio-16-9 w-full flex items-center justify-center"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-[#090d16] border-t border-slate-800/80 py-4 px-4 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
      <p>خدمة البث المباشر مقدمة من <span class="text-emerald-400 font-bold">الباسم سات</span> لأنظمة المراقبة والستلايت</p>
      <p class="text-[11px] text-slate-600">الرام - كفر عقب - القدس وضواحيها | هاتف: 0534829927</p>
    </div>
  </footer>

  <!-- تحميل الكود مع كسر الكاش الزمني دائماً -->
  <script>
    const script = document.createElement('script');
    script.src = 'app.js?v=' + Date.now();
    document.body.appendChild(script);
  </script>
</body>
</html>
