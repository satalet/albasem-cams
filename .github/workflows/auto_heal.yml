name: Albasem Sat Auto-Heal & Radar

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات (الساعة 12 والساعة 6 ليلاً ونهاراً)
    - cron: '0 */6 * * *'
  workflow_dispatch: # يتيح لك تشغيل الفحص يدوياً متى ما أردت من لوحة GitHub Actions

permissions:
  contents: write

jobs:
  health-check-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المشروع
        uses: actions/checkout@v4

      - name: تجهيز بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تشغيل محرك الفحص والإنعاش التلقائي
        run: python auto_heal.py

      - name: حفظ وتطبيق التعديلات السحابية تلقائياً
        run: |
          git config --global user.name "Albasem Auto-Bot"
          git config --global user.email "bot@albasem-sat.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore(auto-heal): auto-update dead streams and live links [skip ci]" && git push origin main)
