name: Albasem Sat Auto-Heal Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المشروع
        uses: actions/checkout@v4

      - name: تجهيز بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت مكتبات القنص ومتصفح Chromium بالسحابة
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: تشغيل محرك الفحص والإنعاش التلقائي
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python auto_heal.py
