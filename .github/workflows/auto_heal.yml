name: Albasem Sat Auto-Heal Engine

on:
  schedule:
    # الفحص التلقائي كل 6 ساعات يومياً
    - cron: '0 */6 * * *'
  # إتاحة زر التشغيل اليدوي من الجوال والكمبيوتر بأي وقت
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto Heal Engine
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python auto_heal.py
